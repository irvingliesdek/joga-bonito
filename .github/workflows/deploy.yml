name: Deploy

# Publiceert alleen als de smoke test slaagt. Draait ook na de srza-scraper:
# die commit met het bot-token, en zo'n commit start uit zichzelf geen enkele
# workflow — zonder deze koppeling zou verse standen-data nooit live komen.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Scrape SRZA']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Alleen de bestanden die de app nodig heeft. Zo belanden backups/,
      # scripts/ en workflows niet op een publieke URL.
      - name: Verzamel site-bestanden
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -r icons data _site/

          # APP_VERSION in index.html is de bron; die blijft ongemoeid. Het
          # commit-kenmerk gaat er alleen achter voor de cachenaam, zodat die
          # ook verloopt als het versienummer een keer niet is opgehoogd.
          VERSIE="$(sed -n "s/^const APP_VERSION = '\(.*\)';$/\1/p" _site/index.html)"
          if [ -z "$VERSIE" ]; then
            echo "::error::kon APP_VERSION niet uit index.html lezen"; exit 1
          fi
          BUILD="${VERSIE}-$(git rev-parse --short HEAD)"
          sed -i "s/const CACHE_NAME = 'joga-bonito-dev';/const CACHE_NAME = 'joga-bonito-${BUILD}';/" _site/sw.js

          grep -q "joga-bonito-${BUILD}" _site/sw.js \
            || { echo "::error::cachenaam niet gestempeld in sw.js"; exit 1; }

          echo "Versie: ${VERSIE} (cache: joga-bonito-${BUILD})"
          echo "Gepubliceerd:"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # Publiceren mislukt af en toe doordat GitHub het zojuist geüploade pakket
      # niet terugvindt ("Fetching artifact metadata failed"). Dat ligt aan hun
      # kant en is bij een tweede poging meestal over, dus we geven het nog twee
      # kansen voordat de run rood wordt. Alleen deze stap wordt herhaald: het
      # uploaden slaagt wel en zou bij herhaling botsen met het bestaande pakket.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Even wachten en opnieuw publiceren
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Publiceren mislukt, over 60 seconden nog een poging."
          sleep 60

      - id: deployment-2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Nog één keer wachten en publiceren
        if: steps.deployment.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        run: |
          echo "::warning::Tweede poging mislukt, over 3 minuten de laatste."
          sleep 180

      - id: deployment-3
        if: steps.deployment.outcome == 'failure' && steps.deployment-2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Uitkomst
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "Gepubliceerd bij de eerste poging."
          elif [ "${{ steps.deployment-2.outcome }}" = "success" ]; then
            echo "::warning::Pas bij de tweede poging gepubliceerd."
          else
            echo "::warning::Pas bij de derde poging gepubliceerd."
          fi
